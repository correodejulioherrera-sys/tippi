<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17110d">
<title>Los signos de la madera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Young+Serif&display=swap">
<style>
/* Capa sobre la cámara: tablillas de madera oscura, texto en blanco hueso
   (la pintura de los signos) y ocre de la roca para lo ya despertado.
   Un solo aspecto oscuro, a propósito: se lee sobre cualquier imagen de cámara. */
:root {
  --madera: #17110d;
  --madera-alta: #2b1f17;
  --madera-panel: rgba(23, 17, 13, 0.84);
  --madera-borde: rgba(243, 237, 226, 0.16);
  --hueso: #f3ede2;
  --hueso-tenue: #c4b9aa;
  --ocre: #e2924f;
  --lava: #ff8a3d;
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-texto: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radio: 14px;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--madera);
  color: var(--hueso);
  font: 16px/1.45 var(--f-texto);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--ocre); outline-offset: 3px; }

/* ---------- Miniaturas de los signos (progreso) ---------- */
.minis { display: flex; gap: 6px; align-items: center; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.minis::-webkit-scrollbar { display: none; }
.mini {
  flex: none; width: 34px; height: 34px; object-fit: cover; border-radius: 8px;
  border: 2px solid var(--madera-borde); background: var(--madera-alta);
  opacity: 0.5; filter: grayscale(1); transition: opacity 0.4s, filter 0.4s, border-color 0.4s, box-shadow 0.4s;
}
.mini.visto { opacity: 1; filter: none; border-color: var(--ocre); }
.mini.activo { box-shadow: 0 0 0 3px rgba(255, 138, 61, 0.5); }
.minis-grande { flex-wrap: wrap; justify-content: center; gap: 10px; overflow: visible; max-width: 34em; }
.minis-grande .mini { width: 68px; height: 68px; border-radius: 12px; opacity: 1; filter: none; }
.mini.mas { display: grid; place-items: center; opacity: 1; filter: none; font: 700 15px/1 var(--f-texto); color: var(--hueso); }
body.muchos .barra .minis { display: none; }
#subt-titulo[hidden] { display: none; }
.tarjeta .minis { flex-wrap: wrap; justify-content: center; overflow: visible; }
.tarjeta .mini { width: 44px; height: 44px; }

/* ---------- Barra superior ---------- */
.barra {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  display: flex; align-items: center; gap: 14px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 14px;
  background: linear-gradient(to bottom, rgba(10, 7, 5, 0.78), rgba(10, 7, 5, 0));
}
.progreso { display: flex; align-items: center; gap: 12px; min-width: 0; }
.contador { font-size: 13px; letter-spacing: 0.04em; color: var(--hueso-tenue); font-variant-numeric: tabular-nums; white-space: nowrap; }
.boton-icono {
  margin-left: auto; flex: none; width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--madera-borde); background: var(--madera-panel);
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
.boton-icono svg { width: 22px; height: 22px; }
.boton-icono .tachado { display: none; }
.boton-icono.apagado .ondas { display: none; }
.boton-icono.apagado .tachado { display: inline; }

/* ---------- Visor, retícula y pistas (AR) ---------- */
.visor {
  position: fixed; left: 50%; top: 47%; z-index: 4; pointer-events: none;
  width: min(74vw, 380px); aspect-ratio: 2 / 1; max-width: 100%;
  transform: translate(-50%, -50%);
  --l: 30px; --g: 2px;
  background:
    linear-gradient(var(--hueso), var(--hueso)) left top / var(--l) var(--g) no-repeat,
    linear-gradient(var(--hueso), var(--hueso)) left top / var(--g) var(--l) no-repeat,
    linear-gradient(var(--hueso), var(--hueso)) right top / var(--l) var(--g) no-repeat,
    linear-gradient(var(--hueso), var(--hueso)) right top / var(--g) var(--l) no-repeat,
    linear-gradient(var(--hueso), var(--hueso)) left bottom / var(--l) var(--g) no-repeat,
    linear-gradient(var(--hueso), var(--hueso)) left bottom / var(--g) var(--l) no-repeat,
    linear-gradient(var(--hueso), var(--hueso)) right bottom / var(--l) var(--g) no-repeat,
    linear-gradient(var(--hueso), var(--hueso)) right bottom / var(--g) var(--l) no-repeat;
  opacity: 0.85;
  animation: respirar 2.4s ease-in-out infinite;
  transition: opacity 0.3s;
}
body.viendo .visor, body.lejos .visor { opacity: 0; animation: none; }
@keyframes respirar { 50% { opacity: 0.45; } }

.reticula {
  position: fixed; left: 50%; top: 50%; z-index: 5; pointer-events: none;
  width: 34vmin; height: 34vmin; transform: translate(-50%, -50%); --p: 0;
}
.reticula svg { width: 100%; height: 100%; overflow: visible; }
.reticula .aro { fill: none; stroke: var(--hueso); stroke-opacity: 0.6; stroke-width: 1.4; stroke-dasharray: 2 4; }
.reticula .carga {
  fill: none; stroke: var(--ocre); stroke-width: 3.2; stroke-linecap: round;
  transform: rotate(-90deg); transform-origin: 50% 50%;
  stroke-dasharray: 289; stroke-dashoffset: calc(289 * (1 - var(--p)));
}
.reticula.fijada .aro { stroke: var(--ocre); stroke-opacity: 0.95; stroke-dasharray: none; }

.pista {
  position: fixed; left: 16px; right: 16px; z-index: 9;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  width: fit-content; max-width: 30em; margin: 0 auto;
  padding: 10px 18px; border-radius: 999px;
  background: var(--madera-panel); border: 1px solid var(--madera-borde);
  font-size: 15px; text-align: center; text-wrap: balance;
  opacity: 0; transform: translateY(8px); transition: opacity 0.35s, transform 0.35s;
  pointer-events: none;
}
.pista.visible { opacity: 1; transform: none; }

/* ---------- Tablilla de subtítulos ---------- */
.subtitulo {
  position: fixed; left: 12px; right: 12px; z-index: 9;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  max-width: 560px; margin: 0 auto;
  display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start;
  padding: 14px 18px 16px 14px;
  background: var(--madera-panel); border: 1px solid var(--madera-borde); border-radius: var(--radio);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  opacity: 0; transform: translateY(14px); transition: opacity 0.4s ease, transform 0.4s ease;
  pointer-events: none;
}
.subtitulo.visible { opacity: 1; transform: none; }
.subt-icono { width: 44px; height: 44px; }
.subt-icono img { width: 100%; height: 100%; display: block; object-fit: cover; border-radius: 8px; }
.subt-cuerpo { min-width: 0; }
.subtitulo h2 { margin: 3px 0 5px; font: 400 21px/1.15 var(--f-display); text-wrap: balance; }
.subtitulo p { margin: 0; font-size: 16.5px; line-height: 1.5; max-width: 62ch; }

/* ---------- Pantallas: portada, avisos y final ---------- */
.portada, .aviso {
  position: fixed; inset: 0; z-index: 20; overflow-y: auto;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  padding: calc(env(safe-area-inset-top, 0px) + 28px) 20px calc(env(safe-area-inset-bottom, 0px) + 28px);
  text-align: center;
}
.portada { background: radial-gradient(130% 75% at 50% 8%, var(--madera-alta) 0%, var(--madera) 62%); justify-content: safe center; }
.aviso { background: rgba(12, 9, 7, 0.72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); z-index: 30; }
.etiqueta { margin: 0; text-transform: uppercase; letter-spacing: 0.16em; font-size: 12px; font-weight: 700; color: var(--ocre); }
.portada h1 { margin: -6px 0 0; font: 400 clamp(32px, 9vw, 52px)/1.04 var(--f-display); text-wrap: balance; max-width: 12em; }
.intro { margin: 0; max-width: 33em; color: var(--hueso-tenue); font-size: 17px; text-wrap: pretty; }
.boton {
  appearance: none; border: 0; border-radius: 999px; cursor: pointer;
  padding: 15px 28px; background: var(--hueso); color: var(--madera);
  font: 400 18px/1 var(--f-display);
  box-shadow: 0 0 0 5px rgba(243, 237, 226, 0.12);
}
.boton:active { transform: translateY(1px); }
.nota { margin: 0; font-size: 13.5px; color: var(--hueso-tenue); }
.tarjeta {
  width: min(420px, 100%); display: grid; gap: 16px; justify-items: center;
  padding: 26px 22px; border-radius: var(--radio);
  background: var(--madera); border: 1px solid var(--madera-borde);
}
.tarjeta h2 { margin: 0; font: 400 24px/1.15 var(--f-display); text-wrap: balance; }
.tarjeta p { margin: 0; }
.girando {
  width: 44px; height: 44px; border-radius: 50%;
  border: 3px solid var(--madera-borde); border-top-color: var(--ocre);
  animation: girar 0.9s linear infinite;
}
@keyframes girar { to { transform: rotate(360deg); } }
.depuracion {
  position: fixed; left: 8px; top: calc(env(safe-area-inset-top, 0px) + 70px); z-index: 40;
  padding: 6px 10px; border-radius: 6px; background: rgba(0, 0, 0, 0.6);
  font: 12px/1.3 ui-monospace, Menlo, Consolas, monospace; color: #9fe39f;
}

/* ---------- Idiomas: botones en la portada y menú en la barra ---------- */
.idiomas { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 32em; }
.idioma-op {
  appearance: none; cursor: pointer; min-height: 38px; padding: 8px 15px; border-radius: 999px;
  border: 1px solid var(--madera-borde); background: rgba(243, 237, 226, 0.04); color: var(--hueso-tenue);
  font: 700 14px/1 var(--f-texto);
}
.idioma-op[aria-pressed="true"] { background: var(--hueso); border-color: var(--hueso); color: var(--madera); }
.acciones-barra { margin-left: auto; flex: none; display: flex; gap: 8px; align-items: center; }
.acciones-barra .boton-icono { margin-left: 0; }
.menu-idioma { position: relative; }
.boton-idioma { font: 700 13px/1 var(--f-texto); letter-spacing: 0.06em; }
.lista-idioma {
  position: absolute; top: calc(100% + 8px); right: 0; z-index: 12;
  min-width: 180px; max-height: min(60vh, 440px); overflow-y: auto;
  margin: 0; padding: 6px; list-style: none;
  background: var(--madera); border: 1px solid var(--madera-borde); border-radius: 12px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
}
.lista-idioma button {
  width: 100%; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 10px 12px; border: 0; border-radius: 8px; background: transparent;
  color: var(--hueso); font-size: 15.5px; text-align: left; cursor: pointer;
}
.lista-idioma button:hover, .lista-idioma button:focus-visible { background: var(--madera-alta); }
.lista-idioma button[aria-checked="true"]::after { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ocre); }

/* ---------- Experiencia AR ---------- */
#contenedor-ar { position: fixed; inset: 0; overflow: hidden; z-index: 0; background: #000; }
#contenedor-ar a-scene { width: 100%; height: 100%; }

@media (prefers-reduced-motion: reduce) {
  .visor, .girando { animation: none; }
  .subtitulo, .pista { transition: none; }
}
@media (min-width: 720px) {
  .subtitulo h2 { font-size: 23px; }
  .subtitulo p { font-size: 17.5px; }
}

      for (let i = 0; i <= 360; i++) {
        const s = i / 360, a = s * vueltas * Math.PI * 2, r = 0.17 * (1 - 0.82 * s);
        pts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, 0.015 + s * 0.42));
      }
      const curva = new THREE.CatmullRomCurve3(pts);
      const geo = new THREE.TubeGeometry(curva, 420, 0.009, 6, false);
      const total = geo.index.count;
      geo.setDrawRange(0, 0);
      const giro = new THREE.Group();
      giro.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xf3ede2 })));
      g.add(giro);

      const sol = new THREE.Mesh(new THREE.SphereGeometry(0.024, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffd58a }));
      sol.add(brillo(THREE, 0xffb35c, 0.24, 0.9));
      sol.visible = false; giro.add(sol);

      const lunas = [], geoLuna = new THREE.SphereGeometry(0.012, 10, 8);
      for (let k = 1; k <= 12; k++) {
        const l = new THREE.Mesh(geoLuna, new THREE.MeshBasicMaterial({ color: 0xc9d6e8, transparent: true, opacity: 0 }));
        l.userData.u = k / 13; l.position.copy(curva.getPointAt(l.userData.u)); giro.add(l); lunas.push(l);
      }
      const desp = despertar(THREE, g, 'espiral');
      return t => {
        desp(t);
        geo.setDrawRange(0, Math.floor(total * U.suave(U.fase(t, 0.3, 2.6)) / 3) * 3);
        giro.rotation.z = -t * 0.35;
        const vivo = t > 2.5;
        sol.visible = vivo;
        if (vivo) {
          const u = ((t - 2.5) * 0.12) % 1;
          sol.position.copy(curva.getPointAt(u));
          for (const l of lunas) {
            const cerca = Math.max(0, 1 - Math.abs(l.userData.u - u) * 14);
            l.material.opacity = 0.35 + cerca * 0.65; l.scale.setScalar(1 + cerca * 1.2);
          }
        } else for (const l of lunas) l.material.opacity = U.fase(t, 2, 0.5) * 0.35;
      };
    },

    /* ---- 3 · La montaña de fuego: un volcán brota del triángulo ---- */
    volcan(THREE, g) {
      const base = new THREE.Group(); base.position.set(0, -0.2, 0.2); g.add(base);
      const perfil = [[0.27, 0], [0.24, 0.045], [0.19, 0.115], [0.13, 0.2], [0.085, 0.27], [0.072, 0.295], [0.052, 0.282], [0.02, 0.272], [0, 0.272]]
        .map(([r, y]) => new THREE.Vector2(r, y));
      const volcan = new THREE.Mesh(new THREE.LatheGeometry(perfil, 28), new THREE.MeshStandardMaterial({ color: 0x3e2c23, roughness: 0.95, metalness: 0, flatShading: true }));
      base.add(volcan);
      const lava = new THREE.Mesh(new THREE.CircleGeometry(0.058, 24), new THREE.MeshBasicMaterial({ color: 0xff6a1f }));
      lava.rotation.x = -Math.PI / 2; lava.position.y = 0.277; volcan.add(lava);
      const resplandor = brillo(THREE, 0xff7a2f, 0.55, 0); resplandor.position.y = 0.34; volcan.add(resplandor);

      const coladas = [0.35, 2.45, 4.35].map((ang, i) => {
        const pts = [];
        for (let k = 0; k <= 14; k++) {
          const s = k / 14, y = 0.285 - s * 0.27, r = 0.27 - 0.68 * y + 0.007, a = ang + Math.sin(s * 5 + i) * 0.16;
          pts.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));
        }
        const geo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 48, 0.008, 5, false);
        geo.setDrawRange(0, 0);
        volcan.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xff8a3d })));
        return geo;
      });

      const NB = 70, brasas = new THREE.InstancedMesh(new THREE.SphereGeometry(0.009, 6, 4), new THREE.MeshBasicMaterial({ color: 0xffb04a }), NB);
      brasas.frustumCulled = false; base.add(brasas);
      const B = Array.from({ length: NB }, () => ({ vida: U.azar(0, 1.6), viva: false }));

      const NP = 24, piedras = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(0.013, 0), new THREE.MeshStandardMaterial({ color: 0x5b534d, roughness: 1, flatShading: true }), NP);
      piedras.frustumCulled = false; base.add(piedras);
      const P = Array.from({ length: NP }, () => ({ x: U.azar(-0.42, 0.42), y: U.azar(0.5, 1.4), z: U.azar(-0.12, 0.12), v: U.azar(0.18, 0.32), r: U.azar(0, 6) }));

      const humo = Array.from({ length: 7 }, (_, i) => {
        const m = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8), new THREE.MeshBasicMaterial({ color: 0x8a817a, transparent: true, opacity: 0, depthWrite: false }));
        m.userData.f = i / 7; base.add(m); return m;
      });

      const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), v3 = new THREE.Vector3(), esc = new THREE.Vector3();
      const nada = oculto(THREE), desp = despertar(THREE, g, 'montana');
      return (t, dt) => {
        desp(t);
        const sube = U.rebote(U.fase(t, 0.3, 1.3));
        volcan.scale.set(0.7 + 0.3 * sube, Math.max(0.001, sube), 0.7 + 0.3 * sube);
        const fuego = U.fase(t, 1.6, 0.6);
        resplandor.material.opacity = fuego * (0.6 + 0.3 * Math.sin(t * 9) * Math.sin(t * 3.7));
        coladas.forEach((geo, i) => geo.setDrawRange(0, Math.floor(geo.index.count * U.fase(t, 1.9 + i * 0.5, 2.6) / 3) * 3));

        for (let i = 0; i < NB; i++) {
          const p = B[i];
          if (t < 1.7) { brasas.setMatrixAt(i, nada); continue; }
          p.vida -= dt;
          if (p.vida <= 0) {
            p.viva = true; p.vida = U.azar(0.9, 1.6);
            p.x = U.azar(-0.03, 0.03); p.y = 0.29; p.z = U.azar(-0.03, 0.03);
            p.vx = U.azar(-0.22, 0.22); p.vy = U.azar(0.55, 0.95); p.vz = U.azar(-0.22, 0.22);
          }
          if (!p.viva) { brasas.setMatrixAt(i, nada); continue; }
          p.vy -= 1.3 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
          const s = U.clamp(p.vida * 1.5);
          m4.makeScale(s, s, s).setPosition(p.x, p.y, p.z); brasas.setMatrixAt(i, m4);
        }
        brasas.instanceMatrix.needsUpdate = true;

        for (let i = 0; i < NP; i++) {
          const p = P[i];
          if (t < 2.2) { piedras.setMatrixAt(i, nada); continue; }
          p.y -= p.v * dt; p.r += dt * 2;
          if (p.y < 0.01) { p.y = U.azar(0.65, 0.9); p.x = U.azar(-0.42, 0.42); }
          e.set(p.r, p.r * 0.7, 0); q.setFromEuler(e); v3.set(p.x, p.y, p.z); esc.setScalar(p.y > 0.55 ? 0.001 : 1);
          m4.compose(v3, q, esc); piedras.setMatrixAt(i, m4);
        }
        piedras.instanceMatrix.needsUpdate = true;

        for (const h of humo) {
          if (t < 1.6) { h.visible = false; continue; }
          const f = ((t - 1.6) * 0.22 + h.userData.f) % 1;
          h.visible = true;
          h.position.set(Math.sin(f * 6 + h.userData.f * 9) * 0.04, 0.31 + f * 0.5, 0);
          h.scale.setScalar(0.035 + f * 0.11);
          h.material.opacity = 0.32 * (1 - f) * fuego;
        }
      };
    },

    /* ---- 4 · La vasija: una vasija decorada recoge el grano ---- */
    vasija(THREE, g) {
      const base = new THREE.Group(); base.position.set(0, -0.19, 0.19); g.add(base);
      const perfil = [[0, 0], [0.07, 0.003], [0.12, 0.03], [0.16, 0.09], [0.172, 0.15], [0.16, 0.21], [0.12, 0.26], [0.085, 0.29], [0.08, 0.31], [0.095, 0.325], [0.09, 0.335]]
        .map(([r, y]) => new THREE.Vector2(r, y));
      const vasija = new THREE.Mesh(new THREE.LatheGeometry(perfil, 40), new THREE.MeshStandardMaterial({ map: textoVasija(THREE), roughness: 0.85, metalness: 0, side: THREE.DoubleSide }));
      base.add(vasija);

      const NG = 46, granos = new THREE.InstancedMesh(new THREE.SphereGeometry(0.008, 6, 4), new THREE.MeshStandardMaterial({ color: 0xe9c46a, roughness: 0.7 }), NG);
      granos.frustumCulled = false; base.add(granos);
      const G = Array.from({ length: NG }, () => ({ x0: U.azar(-0.2, 0.2), z0: U.azar(-0.08, 0.08), y: U.azar(0.75, 1.6), v: U.azar(0.3, 0.45) }));

      const orbita = new THREE.Group(); orbita.position.y = 0.2; base.add(orbita);
      const glifos = ['espiral', 'montana', 'lluvia'].map((id, i) => {
        const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: texGlifo(THREE, id), transparent: true, opacity: 0, depthWrite: false }));
        s.scale.setScalar(0.1); const a = i * Math.PI * 2 / 3; s.position.set(Math.cos(a) * 0.3, 0, Math.sin(a) * 0.3);
        orbita.add(s); return s;
      });

      const m4 = new THREE.Matrix4(), nada = oculto(THREE), desp = despertar(THREE, g, 'vasija');
      return (t, dt) => {
        desp(t);
        const sube = U.rebote(U.fase(t, 0.3, 1.2));
        vasija.scale.set(Math.max(0.001, 0.8 + 0.2 * sube), Math.max(0.001, sube), Math.max(0.001, 0.8 + 0.2 * sube));
        vasija.rotation.y = t * 0.45;
        for (let i = 0; i < NG; i++) {
          const p = G[i];
          if (t < 1.4) { granos.setMatrixAt(i, nada); continue; }
          p.y -= p.v * dt;
          if (p.y < 0.33) { p.y = U.azar(0.7, 0.95); p.x0 = U.azar(-0.2, 0.2); }
          const k = U.clamp((0.72 - p.y) / 0.39); // se acercan a la boca al caer
          if (p.y > 0.72) granos.setMatrixAt(i, nada);
          else { m4.makeTranslation(p.x0 * (1 - k * 0.85), p.y, p.z0 * (1 - k * 0.85)); granos.setMatrixAt(i, m4); }
        }
        granos.instanceMatrix.needsUpdate = true;
        orbita.rotation.y = -t * 0.6;
        const o = U.fase(t, 1.8, 1.0);
        glifos.forEach(s => { s.material.opacity = o * 0.9; });
      };
    },

    /* ---- 5 · El mar: ondas desde el sol y una barca en el agua ---- */
    mar(THREE, g) {
      const sol = new THREE.Mesh(new THREE.SphereGeometry(0.055, 20, 14), new THREE.MeshBasicMaterial({ color: 0xffd27a }));
      sol.add(brillo(THREE, 0xffa94d, 0.42, 0.85));
      g.add(sol);
      const ondas = Array.from({ length: 4 }, () => {
        const o = new THREE.Mesh(new THREE.TorusGeometry(1, 0.02, 6, 72), new THREE.MeshBasicMaterial({ color: 0xbfeaf0, transparent: true, opacity: 0, depthWrite: false }));
        g.add(o); return o;
      });

      const geoMar = new THREE.PlaneGeometry(1.0, 0.42, 40, 16);
      geoMar.rotateX(-Math.PI / 2);
      const pos = geoMar.attributes.position, base0 = Float32Array.from(pos.array);
      const mar = new THREE.Mesh(geoMar, new THREE.MeshStandardMaterial({ color: 0x2c8a99, roughness: 0.35, metalness: 0.1, transparent: true, opacity: 0.9, flatShading: true, side: THREE.DoubleSide }));
      mar.position.set(0, -0.2, 0.2); mar.rotation.x = 0.35; g.add(mar);
      const altura = (x, z, t) => 0.018 * Math.sin(x * 9 + t * 1.7) + 0.012 * Math.sin(z * 13 - t * 1.3 + x * 2);

      const barca = new THREE.Group();
      const casco = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.13, 14, 1, false, 0, Math.PI), new THREE.MeshStandardMaterial({ color: 0x6b4428, roughness: 0.9, side: THREE.DoubleSide }));
      casco.rotation.z = -Math.PI / 2;
      const forma = new THREE.Shape(); forma.moveTo(0, 0); forma.lineTo(0, 0.11); forma.lineTo(0.07, 0.012); forma.lineTo(0, 0);
      const vela = new THREE.Mesh(new THREE.ShapeGeometry(forma), new THREE.MeshBasicMaterial({ color: 0xf3ede2, side: THREE.DoubleSide }));
      vela.position.set(-0.01, 0.004, 0);
      barca.add(casco, vela); barca.scale.setScalar(0.001); mar.add(barca);

      const desp = despertar(THREE, g, 'mar');
      return t => {
        desp(t);
        sol.position.set(0, U.salida(U.fase(t, 0.2, 1.0)) * 0.07, 0.16);
        sol.scale.setScalar(Math.max(0.001, U.rebote(U.fase(t, 0.2, 0.8))));
        ondas.forEach((o, i) => {
          const f = t > 0.8 ? ((t - 0.8) / 2.4 + i / ondas.length) % 1 : -1;
          o.visible = f >= 0;
          if (f >= 0) { o.position.copy(sol.position); o.scale.set(0.08 + f * 0.45, 0.08 + f * 0.45, 1); o.material.opacity = 0.75 * (1 - f); }
        });
        const aparece = U.salida(U.fase(t, 0.6, 1.2));
        mar.scale.set(Math.max(0.001, aparece), 1, Math.max(0.001, aparece));
        for (let i = 0; i < pos.count; i++) pos.setY(i, altura(base0[i * 3], base0[i * 3 + 2], t));
        pos.needsUpdate = true;
        const b = U.fase(t, 1.4, 0.8);
        barca.scale.setScalar(Math.max(0.001, U.rebote(b)));
        const x = -0.4 + (((t - 1.4) * 0.05) % 0.8 + 0.8) % 0.8;
        barca.position.set(x, altura(x, 0.02, t) + 0.006, 0.02);
        barca.rotation.z = Math.atan(0.018 * 9 * Math.cos(x * 9 + t * 1.7)) * 0.8;
      };
    },
  };

  /* ---- Destello: chispas que suben desde el dibujo ---- */
  ESCENAS.destello = function (THREE, g) {
    const N = 90;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const mat = new THREE.PointsMaterial({ size: 0.05, map: texBrillo(THREE), transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true, sizeAttenuation: true });
    const puntos = new THREE.Points(geo, mat);
    puntos.frustumCulled = false;
    g.add(puntos);
    const P = Array.from({ length: N }, () => ({ fase: Math.random(), r: U.azar(0.05, 0.42), a: U.azar(0, Math.PI * 2), v: U.azar(0.2, 0.45) }));
    const paleta = [0xfff1d0, 0xffc56b, 0xff8a3d].map(c => new THREE.Color(c));
    P.forEach((p, i) => { const c = paleta[i % 3]; col.set([c.r, c.g, c.b], i * 3); });
    const halo = brillo(THREE, 0xffd59a, 0.9, 0); halo.position.z = 0.05; g.add(halo);
    const desp = despertar(THREE, g, 'destello');
    return t => {
      desp(t);
      const on = U.fase(t, 0.2, 0.8);
      halo.material.opacity = on * (0.45 + 0.2 * Math.sin(t * 3));
      for (let i = 0; i < N; i++) {
        const p = P[i], f = (t * p.v * 0.6 + p.fase) % 1, ang = p.a + t * 0.8 + f * 2.5, r = p.r * (0.3 + f);
        pos[i * 3] = Math.cos(ang) * r;
        pos[i * 3 + 1] = Math.sin(ang) * r * 0.6 + f * 0.25;
        pos[i * 3 + 2] = 0.03 + f * 0.35;
      }
      geo.attributes.position.needsUpdate = true;
      mat.opacity = on;
      mat.size = 0.035 + 0.02 * Math.sin(t * 6);
    };
  };
  ESCENAS.ninguno = function (THREE, g) { const desp = despertar(THREE, g, null); return t => desp(t); };

  /* =====================================================================
     EFECTOS NUEVOS

  Object.assign(ESCENAS, {
    /* ---- Fuego: una hoguera con llamas, brasas que suben y humo ---- */
    fuego(THREE, g) {
      const base = new THREE.Group(); base.position.set(0, -0.2, 0.17); g.add(base);

      });
      const matPiedra = new THREE.MeshStandardMaterial({ color: 0x6d655d, roughness: 1, flatShading: true });
      for (let i = 0; i < 9; i++) {
        const a = i / 9 * Math.PI * 2, p = new THREE.Mesh(new THREE.DodecahedronGeometry(U.azar(0.014, 0.02), 0), matPiedra);
        p.position.set(Math.cos(a) * 0.13, 0.008, Math.sin(a) * 0.1); base.add(p);
      }
      // Lenguas de fuego: rojas y anchas por fuera, amarillas y cortas por dentro; cada una se mece desde su base
      const llamas = [];
      [[0xff3d12, 0.7, 0.085, 0.3, 6, 0.055], [0xff7a1a, 0.75, 0.065, 0.24, 5, 0.04], [0xffc85a, 0.8, 0.045, 0.16, 4, 0.024], [0xfff3d6, 0.6, 0.026, 0.085, 2, 0.008]]
        .forEach(([color, op, w, h, n, sep]) => {
          for (let i = 0; i < n; i++) {
            const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: texLlama(THREE), color, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false }));
            s.center.set(0.5, 0.04);
            const k = n > 1 ? (i / (n - 1)) * 2 - 1 : 0;
            s.userData = { w: w * U.azar(0.85, 1.15), h: h * (1 - Math.abs(k) * 0.35) * U.azar(0.9, 1.1), x: k * sep, f: U.azar(0, 6.28), v: U.azar(7, 11) };
            s.position.set(k * sep, 0.022, U.azar(-0.02, 0.02));
            base.add(s); llamas.push(s);
          }
        });
      const resplandor = brillo(THREE, 0xff8a3d, 0.75, 0); resplandor.position.y = 0.1; base.add(resplandor);
      const NB = 40, brasas = new THREE.InstancedMesh(new THREE.SphereGeometry(0.005, 6, 4), new THREE.MeshBasicMaterial({ color: 0xffb347 }), NB);
      brasas.frustumCulled = false; base.add(brasas);
      const B = Array.from({ length: NB }, () => ({ vida: U.azar(0, 2), t: 2, x: 0, y: 0.08, z: 0, vx: 0, vy: 0.2, vz: 0 }));
      const humo = Array.from({ length: 6 }, (_, i) => {
        const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: texBrillo(THREE), color: 0x7a716a, transparent: true, opacity: 0, depthWrite: false }));
        s.userData.f = i / 6; base.add(s); return s;
      });
      const m4 = new THREE.Matrix4(), nada = oculto(THREE), desp = despertar(THREE, g, 'fuego');
      return (t, dt) => {
        desp(t);
        const fuerza = U.salida(U.fase(t, 0.3, 1.2));
        for (const s of llamas) {
          const u = s.userData, p = 0.74 + 0.26 * Math.sin(t * u.v + u.f) * Math.sin(t * u.v * 0.61 + u.f * 2.3);
          s.scale.set(Math.max(0.001, u.w * fuerza * (0.9 + 0.1 * p)), Math.max(0.001, u.h * fuerza * p), 1);

          p.vida -= dt;
          if (p.vida <= 0) {
            p.vida = p.t = U.azar(1.0, 2.0);
            p.x = U.azar(-0.04, 0.04); p.y = 0.08; p.z = U.azar(-0.04, 0.04);
            p.vx = U.azar(-0.03, 0.03); p.vy = U.azar(0.18, 0.32); p.vz = U.azar(-0.03, 0.03);
          }
          p.x += (p.vx + Math.sin(t * 3 + i) * 0.02) * dt; p.y += p.vy * dt; p.z += p.vz * dt;
          const s = U.clamp(p.vida / p.t * 1.4);

        brasas.instanceMatrix.needsUpdate = true;
        for (const h of humo) {
          const f = ((t * 0.16) + h.userData.f) % 1;
          h.visible = t > 1;
          h.position.set(Math.sin(f * 5 + h.userData.f * 7) * 0.035, 0.28 + f * 0.4, 0);
          h.scale.setScalar(0.07 + f * 0.2);
          h.material.opacity = 0.32 * Math.sin(Math.PI * f) * fuerza;
        }
      };
    },

    /* ---- Fuegos artificiales: cohetes que suben y estallan en chispas con estela ---- */
    fuegos(THREE, g) {
      const COLORES = [0xffd166, 0xff6b6b, 0x7bdff2, 0xc3a6ff, 0x95e08a, 0xffffff].map(c => new THREE.Color(c));
      const N = 70, ESTELA = 0.22, salvas = [];
      const aditivo = { transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true };
      for (let k = 0; k < 4; k++) {
        const geo = new THREE.BufferGeometry(), pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
        const mat = new THREE.PointsMaterial(Object.assign({ size: 0.05, map: texBrillo(THREE) }, aditivo));
        const puntos = new THREE.Points(geo, mat); puntos.frustumCulled = false; g.add(puntos);
        // Estela de cada chispa: un segmento que va de su color (cabeza) a negro (cola, que al sumar no se ve)

  const infoIdioma = id => IDIOMAS.find(i => i.id === id) || null;

      this.disponibles = lista.length ? [...new Set(lista)] : ['es'];
      this.principal = this.disponibles[0];
      this.actual = this.detectar();

    },

    normalizar(c) {

      return info && this.disponibles.includes(info.id) ? info.id : null;
    },
    // Orden: ?lang= en el enlace (códigos QR), lo que eligió el visitante, idiomas del móvil y, si no, el principal

      try { guardado = window.localStorage.getItem(CLAVE_IDIOMA); } catch (e) { /* sin almacenamiento */ }
      const nav = window.navigator || {};

      for (const c of [enlace, guardado, ...movil]) { const n = this.normalizar(c); if (n) return n; }

    t(clave, datos) { // textos de la interfaz

  /* ---------- Vídeo: plano con el vídeo, con o sin fondo ---------- */
  function materialVideo(THREE, tex, modo) {
    const comun = { transparent: true, depthWrite: false, side: THREE.DoubleSide };
    if (modo === 'pantalla') return new THREE.MeshBasicMaterial(Object.assign({ map: tex, blending: THREE.AdditiveBlending }, comun));
    if (modo === 'croma') {
      return new THREE.ShaderMaterial(Object.assign({
        uniforms: { mapa: { value: tex } },
        vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
        fragmentShader: [
          'uniform sampler2D mapa; varying vec2 vUv;',
          'void main(){',
          '  vec4 c = texture2D(mapa, vUv);',
          '  float verde = c.g - max(c.r, c.b);',
          '  float a = 1.0 - smoothstep(0.06, 0.2, verde);',
          '  c.g = min(c.g, max(c.r, c.b) + 0.04);',
          '  gl_FragColor = vec4(c.rgb, a);',
          '  #include <colorspace_fragment>',
          '}',
        ].join('\n'),
      }, comun));
    }
    return new THREE.MeshBasicMaterial(Object.assign({ map: tex }, comun));
  }

  const COLOCACION = { escala: 1, x: 0, y: 0, elevacion: 0.02, giro: 0, inclinacion: 0 };
  function grupoPlano(THREE, raiz, a) { // plano sobre la imagen: posición, separación, giro e inclinación
    const g = new THREE.Group();
    g.position.set(a.x, a.y, a.elevacion);
    raiz.add(g);
    const pivote = new THREE.Group();
    pivote.rotation.set(U.rad(a.inclinacion), 0, U.rad(a.giro));
    pivote.scale.setScalar(a.escala);
    g.add(pivote);
    return pivote;
  }

  function crearVideo(THREE, raiz, r, url) {
    const a = Object.assign({}, COLOCACION, { modo: 'normal', sonido: false, repetir: true }, r);
    const video = document.createElement('video');
    video.muted = !a.sonido; video.loop = a.repetir !== false; video.playsInline = true; video.preload = 'auto';
    if (!a.sonido) video.setAttribute('muted', '');
    video.setAttribute('playsinline', '');
    video.crossOrigin = 'anonymous';
    video.src = url;
    const tex = prepararTextura(THREE, new THREE.VideoTexture(video));
    const plano = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), materialVideo(THREE, tex, a.modo));
    plano.scale.set(1, 0.5625, 1);
    video.addEventListener('loadedmetadata', () => plano.scale.set(1, (video.videoHeight / video.videoWidth) || 0.5625, 1));
    grupoPlano(THREE, raiz, a).add(plano);
    return {
      medio: video,
      activar() {
        try { video.currentTime = 0; } catch (e) { /* aún sin datos */ }
        const p = video.play();
        if (p) p.catch(() => { if (!video.muted) { video.muted = true; video.play().catch(() => {}); } }); // sin permiso para sonar: sigue en silencio
      },
      desactivar() { video.pause(); },
      actualizar() {},
    };
  }

  function crearImagen(THREE, raiz, r, url) {
    const a = Object.assign({}, COLOCACION, r);
    const mat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide });
    const plano = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
    new THREE.TextureLoader().load(url, tex => {
      prepararTextura(THREE, tex);
      mat.map = tex; mat.needsUpdate = true;
      const im = tex.image;
      if (im && im.width) plano.scale.set(1, im.height / im.width, 1);
    });
    const pivote = grupoPlano(THREE, raiz, a);
    pivote.add(plano);
    return {
      activar() {}, desactivar() {},
      actualizar(t) { // aparece con un pequeño crecimiento
        mat.opacity = U.fase(t, 0.1, 0.5);
        pivote.scale.setScalar(a.escala * (0.86 + 0.14 * U.salida(U.fase(t, 0.1, 0.6))));
      },
    };
  }

  function crearModelo(THREE, raiz, r, url, suelo) {
    const a = Object.assign({}, COLOCACION, { repetir: true }, r);
    const g = new THREE.Group();
    g.position.set(a.x, a.y, a.elevacion);
    raiz.add(g);
    const orient = new THREE.Group();
    orient.rotation.x = (suelo ? Math.PI / 2 : 0) + U.rad(a.inclinacion);
    const giro = new THREE.Group();
    giro.rotation.y = U.rad(a.giro);
    giro.scale.setScalar(a.escala);

        const caja = new THREE.Box3().setFromObject(modelo), tam = caja.getSize(new THREE.Vector3()), cen = caja.getCenter(new THREE.Vector3());
        const k = 0.6 / (Math.max(tam.x, tam.y, tam.z) || 1);

        modelo.position.set(-cen.x * k, -caja.min.y * k, -caja.min.z * k);
        giro.add(modelo);

      activar() { activo = true; arrancar(); },
      desactivar() { activo = false; },
      actualizar(t, dt) { if (mezclador) mezclador.update(dt); },

      medio: audio,

  function crearEfecto(THREE, raiz, r, suelo) {
    const ancla = new THREE.Group();
    ancla.position.set(r.x || 0, r.y || 0, 0);
    ancla.rotation.z = U.rad(r.giro);
    raiz.add(ancla);
    const orient = new THREE.Group();
    if (suelo) orient.rotation.x = Math.PI / 2; // imagen en mesa o suelo: el efecto crece hacia arriba
    ancla.add(orient);
    const ge = new THREE.Group();
    ge.scale.setScalar(r.escala || 1);
    orient.add(ge);
    const f = (ESCENAS[r.efecto] || ESCENAS.destello)(THREE, ge, r);
    return { activar() {}, desactivar() {}, actualizar: f };
  }

  /* ---------- Todo lo que muestra un source al reconocerlo (en un idioma) ---------- */
  function crearContenido(THREE, raiz, source, urls, idioma) {
    urls = urls || {};
    const suelo = source.apoyo === 'suelo';
    const partes = [];
    let conEfecto = false;
    for (const r of source.resultados || []) {
      if (estaOculto(r, idioma)) continue;
      const url = urls[r.id];
      try {
        if (r.tipo === 'efecto') { partes.push(crearEfecto(THREE, raiz, r, suelo)); conEfecto = true; }
        else if (r.tipo === 'video' && url) partes.push(crearVideo(THREE, raiz, r, url));
        else if (r.tipo === 'modelo' && url) partes.push(crearModelo(THREE, raiz, r, url, suelo));
        else if (r.tipo === 'imagen' && url) partes.push(crearImagen(THREE, raiz, r, url));
        else if (r.tipo === 'audio' && url) partes.push(crearAudio(r, url));
      } catch (e) { console.error('[ar] No se pudo preparar un resultado', r.tipo, e); }
    }
    let aviso = null;
    if (!conEfecto) { const g = new THREE.Group(); raiz.add(g); aviso = despertar(THREE, g, null); } // anillo de «reconocido»
    return {
      medios: partes.map(p => p.medio).filter(Boolean),
      activar() { partes.forEach(p => p.activar()); },
      desactivar() { partes.forEach(p => p.desactivar()); },
      actualizar(t, dt) { if (aviso) aviso(t); partes.forEach(p => p.actualizar(t, dt)); },
    };
  }

  /* ---------- Quita lo que creó crearContenido: para el sonido y libera la memoria ---------- */
  function liberar(grupo, contenido) {
    if (contenido) {
      try { contenido.desactivar(); } catch (e) { /* nada */ }
      (contenido.medios || []).forEach(m => { try { m.pause(); m.removeAttribute('src'); m.load(); } catch (e) { /* nada */ } });
    }
    if (!grupo) return;
    grupo.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) [].concat(o.material).forEach(m => { if (m.map && m.map.isVideoTexture) m.map.dispose(); m.dispose(); });
    });
    while (grupo.children.length) grupo.remove(grupo.children[0]);
  }

  /* ---------- Marca de un signo detectado pero aún dormido ---------- */
  function crearMarca(THREE) {
    if (!cache.geoAro) { cache.geoAro = new THREE.RingGeometry(0.15, 0.178, 48); cache.geoPunto = new THREE.CircleGeometry(0.032, 20); }
    const mat = () => new THREE.MeshBasicMaterial({ color: 0xf3ede2, transparent: true, opacity: 0.92, depthWrite: false, side: THREE.DoubleSide });
    const aro = new THREE.Mesh(cache.geoAro, mat()), punto = new THREE.Mesh(cache.geoPunto, mat());

    const marca = new THREE.Group(); marca.add(aro, punto);

      marca.scale.setScalar(1 + 0.09 * Math.sin(time / 320 + fase));

  /* =====================================================================
     NARRADOR: voz del sistema en el idioma de cada texto, con aviso de fin
     ===================================================================== */
  const Narrador = {
    activo: true, voces: [], elegidas: {}, audio: null, temporizador: null, turno: 0,
    config() { return (window.HISTORIA && window.HISTORIA.voz) || {}; },
    iniciar() {

      const cargar = () => { try { this.voces = window.speechSynthesis.getVoices() || []; } catch (e) { this.voces = []; } this.elegidas = {}; };
      cargar();
      try { window.speechSynthesis.addEventListener('voiceschanged', cargar); } catch (e) { window.speechSynthesis.onvoiceschanged = cargar; }
    },
    // La mejor voz del móvil para un idioma: primero la variante preferida (es-ES, en-GB…), luego cualquiera del idioma
    vozPara(idioma) {
      if (!this.voces.length && 'speechSynthesis' in window) { try { this.voces = window.speechSynthesis.getVoices() || []; } catch (e) { /* sin voces */ } }
      if (idioma in this.elegidas) return this.elegidas[idioma];
      const info = infoIdioma(idioma), prefs = (info ? info.voz : [idioma]).map(p => p.toLowerCase());
      const lang = v => String(v.lang || '').replace('_', '-').toLowerCase();
      const buena = /google|natural|neural|premium|enhanced|mejorad|siri/i;
      let elegida = null;
      for (const p of prefs) {
        const cand = this.voces.filter(v => (p.includes('-') ? lang(v) === p : lang(v).split('-')[0] === p));
        if (cand.length) { elegida = cand.find(v => buena.test(v.name)) || cand.find(v => v.localService) || cand[0]; break; }
      }
      if (this.voces.length) this.elegidas[idioma] = elegida; // con la lista aún vacía se vuelve a buscar
      return elegida;
    },
    desbloquear() { // dentro de un toque del usuario (iOS lo exige)
      try { const u = new window.SpeechSynthesisUtterance(' '); u.volume = 0; window.speechSynthesis.speak(u); } catch (e) { /* sin voz */ }
      try { this.audio = this.audio || new window.Audio(); this.audio.muted = true; const p = this.audio.play(); if (p) p.catch(() => {}); this.audio.pause(); this.audio.muted = false; } catch (e) { /* sin audio */ }
    },
    decir(texto, archivo, alTerminar, idioma) {
      this.callar();
      texto = texto || '';
      const turno = ++this.turno;
      const fin = () => { if (turno === this.turno) { this.turno++; if (alTerminar) alTerminar(); } };
      const porTiempo = () => { clearTimeout(this.temporizador); this.temporizador = setTimeout(fin, Math.max(4500, texto.length * 62)); };
      if (!this.activo || !texto) return porTiempo();
      if (archivo) {
        try {
          this.audio = this.audio || new window.Audio();
          this.audio.src = archivo; this.audio.onended = fin; this.audio.onerror = porTiempo;
          const p = this.audio.play(); if (p) p.catch(porTiempo);
          return;
        } catch (e) { return porTiempo(); }
      }

      if (this.voces.length && !voz) return porTiempo(); // el móvil no tiene voz en ese idioma: solo subtítulos
      const u = new window.SpeechSynthesisUtterance(texto);
      u.lang = String(voz ? voz.lang : (info ? info.voz[0] : l)).replace('_', '-');
      if (voz) u.voice = voz;
      u.rate = this.config().velocidad || 0.96;
      u.onend = fin;
      u.onerror = porTiempo; // sin voz: se respeta el tiempo de lectura
      window.speechSynthesis.speak(u);
      this.temporizador = setTimeout(fin, Math.max(9000, texto.length * 95)); // por si el móvil no avisa del final
    },
    callar() {

  const $ = id => document.getElementById(id);

  const frase = t => (/[.!?…:;]$/.test(t) ? t : t + '.');

  const Interfaz = {
    vistos: new Set(), activo: null, visible: null, narrando: false, finMostrado: false,
    temporPista: null, temporOcultar: null, temporFin: null, ultimoFin: 0, alCambiar: null, alCambiarIdioma: null, genPista: null,
    sources: () => window.HISTORIA.sources,
    source(id) { return this.sources().find(s => s.id === id); },
    textoDe: s => (s.resultados || []).find(r => r.tipo === 'texto' && !estaOculto(r, Idioma.actual) && (Idioma.texto(r.titulo) || Idioma.texto(r.texto))),

    iniciar() {
      const H = window.HISTORIA, n = H.sources.length;
      const mini = s => `<img class="mini" data-id="${escapar(s.id)}" src="${escapar(s.miniatura)}" alt="">`;
      document.querySelectorAll('[data-minis]').forEach(el => {
        const max = el.classList.contains('minis-grande') ? 12 : Infinity; // en la portada, como mucho 12
        el.innerHTML = H.sources.slice(0, max).map(mini).join('') + (n > max ? `<span class="mini mas">+${n - max}</span>` : '');
      });
      document.body.classList.toggle('muchos', n > 10); // con muchos sources, la barra solo muestra el contador
      const bs = $('btn-sonido'); if (bs) bs.addEventListener('click', () => this.alternarSonido());
      const br = $('btn-reiniciar'); if (br) br.addEventListener('click', () => this.reiniciar());
      const bi = $('btn-idioma'), li = $('lista-idioma');
      if (bi && li) {
        bi.addEventListener('click', e => { e.stopPropagation(); this.menuIdioma(li.hidden); });
        document.addEventListener('click', e => { if (!li.hidden && !e.target.closest('#lista-idioma')) this.menuIdioma(false); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && !li.hidden) { this.menuIdioma(false); bi.focus(); } });
      }
      document.addEventListener('click', e => { const b = e.target.closest('[data-idioma]'); if (b) this.cambiarIdioma(b.dataset.idioma); });
      this.pintarTextos();
    },

    /* --- Idioma --- */
    pintarTextos() {
      const H = window.HISTORIA, titulo = Idioma.texto(H.titulo);
      document.documentElement.lang = Idioma.actual;
      if (titulo) document.title = titulo;
      document.querySelectorAll('[data-t]').forEach(el => { el.textContent = Idioma.t(el.dataset.t); });
      document.querySelectorAll('[data-t-aria]').forEach(el => { el.setAttribute('aria-label', Idioma.t(el.dataset.tAria)); });
      document.querySelectorAll('[data-titulo]').forEach(el => { el.textContent = titulo; el.lang = Idioma.de(H.titulo); });
      document.querySelectorAll('[data-intro]').forEach(el => { el.textContent = Idioma.texto(H.intro); el.lang = Idioma.de(H.intro); });
      document.querySelectorAll('.mini[data-id]').forEach(el => { const s = this.source(el.dataset.id); if (s) el.alt = Idioma.texto(s.nombre); });
      this.pintarSelectores();
      this.etiquetaSonido();
      this.actualizar();
      const f = $('final'); if (f && !f.hidden) { $('final-texto').textContent = Idioma.texto(H.final); $('final-texto').lang = Idioma.de(H.final); }
      const p = $('pista'); if (p && this.genPista && p.classList.contains('visible')) p.textContent = this.genPista();
    },
    pintarSelectores() {
      const L = Idioma.disponibles, varios = L.length > 1;
      const op = (id, menu) => menu
        ? `<li role="none"><button type="button" role="menuitemradio" aria-checked="${id === Idioma.actual}" data-idioma="${id}" lang="${id}">${escapar(Idioma.nombre(id))}</button></li>`
        : `<button type="button" class="idioma-op" aria-pressed="${id === Idioma.actual}" data-idioma="${id}" lang="${id}">${escapar(Idioma.nombre(id))}</button>`;
      document.querySelectorAll('[data-idiomas]').forEach(el => { el.hidden = !varios; el.innerHTML = varios ? L.map(id => op(id, false)).join('') : ''; });
      const m = $('menu-idioma'); if (m) m.hidden = !varios;
      const li = $('lista-idioma'); if (li) li.innerHTML = varios ? L.map(id => op(id, true)).join('') : '';
      const c = $('idioma-corto'); if (c) c.textContent = Idioma.actual.toUpperCase();
      const b = $('btn-idioma'); if (b) b.setAttribute('aria-label', `${Idioma.t('idioma')}: ${Idioma.nombre(Idioma.actual)}`);
    },
    menuIdioma(abrir) {
      const bi = $('btn-idioma'), li = $('lista-idioma'); if (!bi || !li) return;
      li.hidden = !abrir; bi.setAttribute('aria-expanded', String(!!abrir));
      if (abrir) { const b = li.querySelector('[aria-checked="true"]') || li.querySelector('button'); if (b) b.focus(); }
    },
    cambiarIdioma(id) {
      const desdeMenu = !!(document.activeElement && document.activeElement.closest && document.activeElement.closest('#lista-idioma'));
      const cambiado = Idioma.cambiar(id, true);
      this.menuIdioma(false);
      if (desdeMenu) { const bi = $('btn-idioma'); if (bi) bi.focus(); }
      if (!cambiado) return;
      console.log('[signos] idioma ' + Idioma.actual);
      this.pintarTextos();
      if (this.alCambiarIdioma) this.alCambiarIdioma(Idioma.actual);
      if (this.visible) {
        const s = this.source(this.visible), tx = s && this.textoDe(s);
        if (tx) this.subtitulo(s, tx); else this.ocultarSubtitulo();
      }
      if (this.narrando && this.activo) this.narrar(this.activo); // lo que estaba contando, ahora en el idioma nuevo
    },

    /* --- Signos --- */
    mostrarSigno(id) {
      const s = this.source(id);
      if (!s) return;
      this.visible = id;
      clearTimeout(this.temporPista); clearTimeout(this.temporOcultar);
      this.pista(null);
      const tx = this.textoDe(s);
      if (tx) this.subtitulo(s, tx); else this.ocultarSubtitulo();
      const repetido = this.activo === id && (this.narrando || performance.now() - this.ultimoFin < 15000);
      if (repetido) return;
      this.activo = id;
      this.vistos.add(id);
      this.actualizar();
      try { if (navigator.vibrate) navigator.vibrate(30); } catch (e) { /* sin vibración */ }
      this.narrar(id);
      if (this.alCambiar) this.alCambiar(id);
    },
    narrar(id) {
      const s = this.source(id), tx = s && this.textoDe(s);
      this.narrando = true;
      clearTimeout(this.temporFin);
      if (tx && tx.voz !== false) {
        const titulo = Idioma.texto(tx.titulo), texto = Idioma.texto(tx.texto);
        const dicho = [titulo && frase(titulo), texto].filter(Boolean).join(' ');
        Narrador.decir(dicho, null, () => this.finNarracion(id), Idioma.de(texto ? tx.texto : tx.titulo));
      } else {
        Narrador.callar();
        this.temporFin = setTimeout(() => this.finNarracion(id), tx ? Math.max(4500, Idioma.texto(tx.texto).length * 62) : 5000);
      }
    },

    perderSigno(id) {
      if (this.visible === id) this.visible = null;
      clearTimeout(this.temporPista);
      this.temporPista = setTimeout(() => { if (!this.visible) this.sugerir(); }, 2600);
      this.programarOcultar();
    },

    finNarracion(id) {
      this.narrando = false; this.ultimoFin = performance.now();
      if (Idioma.texto(window.HISTORIA.final) && this.vistos.size === this.sources().length && !this.finMostrado) {
        this.finMostrado = true;
        setTimeout(() => this.mostrarFinal(), 1200);
        return;
      }
      this.programarOcultar();
      if (!this.visible || this.visible === id) {
        clearTimeout(this.temporPista);
        this.temporPista = setTimeout(() => this.sugerir(), 3500);
      }
    },

    programarOcultar() {
      clearTimeout(this.temporOcultar);
      this.temporOcultar = setTimeout(() => { if (!this.visible && !this.narrando) this.ocultarSubtitulo(); }, 3000);
    },

    subtitulo(s, tx) {
      const caja = $('subtitulo'); if (!caja) return;
      const titulo = Idioma.texto(tx.titulo), texto = Idioma.texto(tx.texto);
      $('subt-icono').innerHTML = `<img src="${escapar(s.miniatura)}" alt="">`;
      $('subt-titulo').textContent = titulo;
      $('subt-titulo').hidden = !titulo;
      $('subt-titulo').lang = Idioma.de(tx.titulo);
      $('subt-texto').textContent = texto;
      $('subt-texto').lang = Idioma.de(tx.texto);
      caja.hidden = false;
      requestAnimationFrame(() => caja.classList.add('visible'));
    },
    ocultarSubtitulo() { const c = $('subtitulo'); if (c) c.classList.remove('visible'); },

    // La pista se guarda como función para volver a escribirla si cambia el idioma
    pista(gen) {
      const p = $('pista'); if (!p) return;
      this.genPista = typeof gen === 'function' ? gen : (gen ? () => gen : null);
      if (!this.genPista) { p.classList.remove('visible'); return; }
      p.textContent = this.genPista(); p.classList.add('visible');
    },
    sugerir() {
      const faltan = this.sources().filter(s => !this.vistos.has(s.id));
      if (!faltan.length) return;
      this.pista(() => {
        if (faltan.length > 3) return Idioma.t('quedan', { n: faltan.length });
        const nombres = faltan.map(s => Idioma.texto(s.nombre) || Idioma.t('unaImagen'));
        return Idioma.t(nombres.length === 1 ? 'falta1' : 'faltan', { lista: Idioma.lista(nombres) });
      });
    },

    actualizar() {
      document.querySelectorAll('.mini[data-id]').forEach(el => {
        el.classList.toggle('visto', this.vistos.has(el.dataset.id));
        el.classList.toggle('activo', this.activo === el.dataset.id);
      });
      const c = $('contador'); if (c) c.textContent = Idioma.t('contador', { n: this.vistos.size, total: this.sources().length });
    },

    etiquetaSonido() {
      const b = $('btn-sonido'); if (!b) return;
      b.setAttribute('aria-pressed', String(Narrador.activo));
      b.setAttribute('aria-label', Idioma.t(Narrador.activo ? 'silenciar' : 'activarVoz'));
      b.classList.toggle('apagado', !Narrador.activo);
    },
    alternarSonido() {
      Narrador.activo = !Narrador.activo;
      if (!Narrador.activo) Narrador.callar();
      this.etiquetaSonido();
    },

    mostrarFinal() {
      const f = $('final'); if (!f) return;
      const H = window.HISTORIA, texto = Idioma.texto(H.final);
      $('final-texto').textContent = texto;
      $('final-texto').lang = Idioma.de(H.final);
      this.ocultarSubtitulo(); this.pista(null);
      f.hidden = false;
      if (texto) Narrador.decir(texto, null, () => {}, Idioma.de(H.final));
    },

    reiniciar() {
      Narrador.callar();
      this.vistos.clear(); this.activo = null; this.finMostrado = false; this.narrando = false;
      const f = $('final'); if (f) f.hidden = true;
      this.ocultarSubtitulo(); this.actualizar();
      if (this.alCambiar) this.alCambiar(null);
    },

    modoLejos(activo) {
      const r = $('reticula'); if (r) r.hidden = !activo;
      document.body.classList.toggle('lejos', !!activo);
      if (activo && !this.visible) { clearTimeout(this.temporPista); this.pista(() => Idioma.t('centra')); }
      else if (!activo) this.pista(null);
    },
    reticula(progreso, fijado) {
      const r = $('reticula'); if (!r) return;
      r.style.setProperty('--p', progreso.toFixed(3));
      r.classList.toggle('fijada', !!fijado);
    },
  };

  window.Motor = {
    U, ICONOS, iconoSVG, EFECTOS, TIPOS, ESCENAS, IDIOMAS, UI, Idioma, infoIdioma, estaOculto, archivoEn,
    crearContenido, liberar, crearMarca, prepararTextura, Narrador, Interfaz, escapar, Stickman: STICK,
  };
  return window.Motor;
})(window);
</script>
</head>
<body class="modo-ar">
<div id="contenedor-ar"></div>

<div id="hud" hidden>
  <header class="barra">
    <div class="progreso"><div class="minis" data-minis></div><span id="contador" class="contador"></span></div>
    <div class="acciones-barra">
      <div id="menu-idioma" class="menu-idioma" hidden>
        <button id="btn-idioma" class="boton-icono boton-idioma" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="lista-idioma"><span id="idioma-corto"></span></button>
        <ul id="lista-idioma" class="lista-idioma" role="menu" hidden></ul>
      </div>
      <button id="btn-sonido" class="boton-icono" type="button" aria-pressed="true" aria-label="Silenciar la voz">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path class="ondas" d="M15.5 9a4 4 0 0 1 0 6M18.2 6.5a7.5 7.5 0 0 1 0 11"/><path class="tachado" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
    </div>
  </header>
  <div class="visor" aria-hidden="true"></div>
  <div id="reticula" class="reticula" hidden aria-hidden="true"><svg viewBox="0 0 100 100"><circle class="aro" cx="50" cy="50" r="46"/><circle class="carga" cx="50" cy="50" r="46"/></svg></div>
  <p id="pista" class="pista" role="status"></p>
  <section id="subtitulo" class="subtitulo" hidden aria-live="polite">
    <span id="subt-icono" class="subt-icono"></span>
    <div class="subt-cuerpo"><h2 id="subt-titulo"></h2><p id="subt-texto"></p></div>
  </section>
</div>

<section id="portada" class="portada">
  <nav class="idiomas" data-idiomas data-t-aria="idioma" aria-label="Idioma" hidden></nav>
  <p class="etiqueta" data-t="etiqueta">Realidad aumentada</p>
  <h1 data-titulo></h1>
  <div class="minis minis-grande" data-minis></div>
  <p class="intro" data-intro></p>
  <button id="btn-empezar" class="boton" type="button" data-t="empezar">Empezar</button>
  <p class="nota" data-t="nota">Usa la cámara trasera y sube el volumen.</p>
</section>

<section id="cargando" class="aviso" hidden>
  <div class="tarjeta"><div class="girando" aria-hidden="true"></div><p data-t="abriendo">Abriendo la cámara…</p></div>
</section>

<section id="error" class="aviso" hidden>
  <div class="tarjeta">
    <h2 data-t="errorTitulo">No se pudo empezar</h2>
    <p id="error-texto"></p>
    <button id="btn-reintentar" class="boton" type="button" data-t="reintentar">Reintentar</button>
  </div>
</section>

<section id="final" class="aviso" hidden>
  <div class="tarjeta">
    <p class="etiqueta" data-t="todas">Todas descubiertas</p>
    <div class="minis" data-minis></div>
    <h2 id="final-texto"></h2>
    <button id="btn-reiniciar" class="boton" type="button" data-t="deNuevo">Empezar de nuevo</button>
  </div>
</section>

<div id="depuracion" class="depuracion" hidden></div>

<script>
(function appSignosAR(window) {
  'use strict';
  const document = window.document, AFRAME = window.AFRAME, Motor = window.Motor, H = window.HISTORIA;
  const A = Object.assign({ archivo: 'targets.mind', filtroMinCF: 0.0005, filtroBeta: 300, toleranciaPerdida: 6, calentamiento: 3, seguimientoSimultaneo: 3, permanencia: 0.9 }, H.ajustesAR || {});
  const $ = id => document.getElementById(id);
  const depurar = /depurar/.test(window.location.search);
  const avisar = (id, visible) => window.dispatchEvent(new window.CustomEvent('signos:objetivo', { detail: { id, visible } }));
  const componentes = []; // un «signo» por source
  // Vídeos y audios con sonido: se desbloquean con un toque del visitante (Empezar o cambiar de idioma)
  const conSonido = () => componentes.flatMap(c => (c.escena ? c.escena.medios.filter(m => !m.muted) : []));
  const desbloquear = medios => medios.forEach(m => {
    if (m.muted || !m.paused) return;
    try { const p = m.play(); if (p) p.then(() => m.pause()).catch(() => {}); } catch (e) { /* nada */ }
  });

  Motor.Idioma.iniciar(H);
  console.log('[signos] idioma ' + Motor.Idioma.actual);

  AFRAME.registerSystem('selector-signos', {
    init() {
      this.lista = []; this.activo = null; this.candidato = null; this.espera = 0; this.lejos = false;
      const V = AFRAME.THREE.Vector3; this.v = new V(); this.a = new V(); this.b = new V();
    },
    registrar(c) { this.lista.push(c); },
    anchoEnPantalla(c, w, h) { // ancho del dibujo en píxeles de pantalla
      const m = c.el.object3D.matrixWorld, cam = this.el.camera;
      this.a.set(-0.5, 0, 0).applyMatrix4(m).project(cam);
      this.b.set(0.5, 0, 0).applyMatrix4(m).project(cam);
      return Math.hypot((this.a.x - this.b.x) * w / 2, (this.a.y - this.b.y) * h / 2);
    },
    tick(time, dt) {
      if (!this.lista.length) return;
      const I = Motor.Interfaz, d = Math.min(dt || 16, 60) / 1000;
      const vis = this.lista.filter(c => c.visible);
      if (!vis.length) { if (this.lejos) { this.lejos = false; I.modoLejos(false); } return; }
      const lienzo = this.el.canvas, w = lienzo.clientWidth, h = lienzo.clientHeight;
      for (const c of vis) c.el.object3D.updateMatrixWorld(true);
      const ancho = this.anchoEnPantalla(vis[0], w, h);
      if (!isFinite(ancho)) return;
      const lejos = vis.length >= 2 || ancho < Math.min(w, h) * 0.6;
      if (lejos !== this.lejos) { this.lejos = lejos; I.modoLejos(lejos); this.candidato = null; this.espera = 0; }
      if (!lejos) { if (this.activo !== vis[0]) this.activar(vis[0]); return; }
      let mejor = null, dmin = Infinity;
      for (const c of vis) {
        this.v.setFromMatrixPosition(c.centro.matrixWorld).project(this.el.camera);
        const dd = Math.hypot(this.v.x * w / 2, this.v.y * h / 2);
        if (dd < dmin) { dmin = dd; mejor = c; }
      }
      const dentro = dmin < Math.min(w, h) * 0.17 ? mejor : null;
      if (dentro && dentro === this.activo) { I.reticula(1, true); this.candidato = dentro; this.espera = 0; return; }
      if (dentro !== this.candidato) { this.candidato = dentro; this.espera = 0; }
      if (!dentro) { I.reticula(0, false); return; }
      this.espera += d;
      const p = Math.min(1, this.espera / A.permanencia);
      I.reticula(p, false);
      if (p >= 1) this.activar(dentro);
    },
    activar(c) {
      if (this.activo && this.activo !== c) this.activo.desactivar();
      this.activo = c;
      c.activar();
    },
    perder(c) {
      if (this.activo !== c) return;
      c.desactivar();
      this.activo = null;
      Motor.Interfaz.perderSigno(c.source.id);
    },
  });

  AFRAME.registerComponent('signo', {
    schema: { indice: { type: 'int' } },
    init() {
      const THREE = AFRAME.THREE;
      this.source = H.sources[this.data.indice];
      this.contenido = new THREE.Group();
      this.contenido.visible = false;
      this.el.object3D.add(this.contenido);
      this.construir();
      this.centro = new THREE.Object3D();
      this.el.object3D.add(this.centro);
      this.marca = Motor.crearMarca(THREE);
      this.el.object3D.add(this.marca);
      this.fase = this.data.indice * 1.3;
      this.visible = false; this.activo = false; this.t = 0; this.perdidoEn = -1e9;
      componentes.push(this);
      this.sel = this.el.sceneEl.systems['selector-signos'];
      this.sel.registrar(this);
      this.el.addEventListener('targetFound', () => { this.visible = true; avisar(this.source.id, true); });
      this.el.addEventListener('targetLost', () => {
        this.visible = false; this.perdidoEn = window.performance.now();
        this.sel.perder(this); avisar(this.source.id, false);
      });
    },
    // Qué se ve en el idioma actual: resultados ocultos y archivos con versión propia
    firma() {
      const l = Motor.Idioma.actual;
      return JSON.stringify((this.source.resultados || []).map(r => [r.id, Motor.estaOculto(r, l), Motor.archivoEn(r, l)]));
    },
    construir() {
      const l = Motor.Idioma.actual, urls = {};
      (this.source.resultados || []).forEach(r => { const u = Motor.archivoEn(r, l); if (u) urls[r.id] = u; });
      this.escena = Motor.crearContenido(AFRAME.THREE, this.contenido, this.source, urls, l);
      this.hecho = this.firma();
    },
    // Al cambiar de idioma solo se rehace el source que cambia; devuelve sus medios nuevos
    rehacer() {
      if (this.firma() === this.hecho) return [];
      Motor.liberar(this.contenido, this.escena);
      this.construir();
      if (this.activo) { this.t = 0; this.escena.activar(); }
      console.log(`[signos] rehecho ${this.source.id} en ${Motor.Idioma.actual}`);
      return this.escena.medios;
    },
    activar() {
      if (this.activo) return;
      this.activo = true;
      if (window.performance.now() - this.perdidoEn > 2500) this.t = 0; // un parpadeo no reinicia la animación
      this.contenido.visible = true;
      this.escena.activar();
      Motor.Interfaz.mostrarSigno(this.source.id);
    },
    desactivar() { this.activo = false; this.contenido.visible = false; this.escena.desactivar(); },
    tick(time, dt) {
      if (!this.visible) return;
      this.marca.visible = !this.activo;
      if (!this.activo) { this.marca.userData.pintar(time, this.fase, Motor.Interfaz.vistos.has(this.source.id)); return; }
      const d = Math.min(dt || 16, 60) / 1000;
      this.t += d;
      this.escena.actualizar(this.t, d);
    },
  });

  /* --- Escena --- */
  const escena = document.createElement('a-scene');
  const atributos = {
    'mindar-image': `imageTargetSrc: ${A.archivo}; autoStart: false; maxTrack: ${A.seguimientoSimultaneo}; uiLoading: no; uiScanning: no; uiError: no; ` +
      `filterMinCF: ${A.filtroMinCF}; filterBeta: ${A.filtroBeta}; missTolerance: ${A.toleranciaPerdida}; warmupTolerance: ${A.calentamiento}`,
    embedded: '', 'color-space': 'sRGB', renderer: 'colorManagement: true; antialias: true; alpha: true',
    'vr-mode-ui': 'enabled: false', 'xr-mode-ui': 'enabled: false',
    'device-orientation-permission-ui': 'enabled: false', 'loading-screen': 'enabled: false',
  };
  for (const k in atributos) escena.setAttribute(k, atributos[k]);
  escena.innerHTML =
    '<a-camera position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>' +
    '<a-entity light="type: ambient; color: #fff4e8; intensity: 0.85"></a-entity>' +
    '<a-entity light="type: directional; color: #ffffff; intensity: 1.0" position="0.6 1 1.2"></a-entity>';
  H.sources.forEach((s, i) => {
    const e = document.createElement('a-entity');
    e.setAttribute('mindar-image-target', `targetIndex: ${i}`);
    e.setAttribute('signo', `indice: ${i}`);
    escena.appendChild(e);
  });
  $('contenedor-ar').appendChild(escena);

  Motor.Narrador.iniciar();
  Motor.Interfaz.iniciar();
  Motor.Interfaz.alCambiar = id => { if (id) console.log('[signos] despierta ' + id); };

  /* --- Pantallas --- */
  const portada = $('portada'), hud = $('hud'), cargando = $('cargando'), error = $('error');
  let renderListo = false, pedido = false, listo = false, arrancado = false, tipoError = null;
  function mostrarError(tipo) {
    tipoError = tipo;
    cargando.hidden = true; hud.hidden = true;
    $('error-texto').textContent = Motor.Idioma.t(tipo === 'camara' ? 'errorCamara' : 'errorMarcadores');
    error.hidden = false;
  }
  function arrancar() {
    if (arrancado) return;
    arrancado = true;
    try { escena.systems['mindar-image-system'].start(); } catch (e) { console.error(e); mostrarError('marcadores'); }
    setTimeout(() => { if (!listo && error.hidden) mostrarError('marcadores'); }, 30000);
  }
  escena.addEventListener('renderstart', () => { renderListo = true; if (pedido) arrancar(); });
  escena.addEventListener('arReady', () => {
    listo = true; cargando.hidden = true; hud.hidden = false;
    Motor.Interfaz.pista(() => Motor.Idioma.t('apunta'));
    console.log('[signos] AR lista');
  });
  escena.addEventListener('arError', () => mostrarError('camara'));
  window.addEventListener('unhandledrejection', e => { if (!listo && arrancado) { console.error('[signos]', e.reason); mostrarError('marcadores'); } });
  $('btn-empezar').addEventListener('click', () => {
    Motor.Narrador.desbloquear();
    desbloquear(conSonido());
    portada.hidden = true; cargando.hidden = false;
    pedido = true;
    if (renderListo) arrancar();
  });
  $('btn-reintentar').addEventListener('click', () => window.location.reload());

  // Cambiar de idioma es un toque: se rehacen los sources con versión propia y se desbloquea su sonido
  Motor.Interfaz.alCambiarIdioma = () => {
    const nuevos = [];
    componentes.forEach(c => nuevos.push(...c.rehacer()));
    desbloquear(nuevos);
    if (!error.hidden && tipoError) $('error-texto').textContent = Motor.Idioma.t(tipoError === 'camara' ? 'errorCamara' : 'errorMarcadores');
  };

  const visibles = new Set();
  window.addEventListener('signos:objetivo', e => {
    const { id, visible } = e.detail;
    if (visible) visibles.add(id); else visibles.delete(id);
    document.body.classList.toggle('viendo', visibles.size > 0);
    console.log(`[signos] ${visible ? 'veo' : 'pierdo'} ${id}`);
    if (depurar) $('depuracion').textContent = 'Visibles: ' + ([...visibles].join(', ') || 'ninguno') + ' · ' + Motor.Idioma.actual;
  });
  if (depurar) $('depuracion').hidden = false;
  document.addEventListener('visibilitychange', () => { if (document.hidden) Motor.Narrador.callar(); });
})(window);
</script>
</body>
</html>
